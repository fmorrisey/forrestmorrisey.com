name: CI

# Validates PRs before they can land on main, and re-checks main itself.
#
# It used to skip main because the deploy workflow rebuilt everything there.
# Cloudflare Pages now builds and deploys straight from the repo, and its build
# does not run these checks -- so without a main trigger, anything that reached
# main unreviewed would go live unverified. Cloudflare deploys regardless of
# this workflow's result; requiring the check in branch protection is what makes
# it a gate rather than a report.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

# SECURITY: must stay on ubuntu-latest, never [self-hosted, rainier].
# This repo is public and this workflow has a pull_request trigger, so a fork's
# PR runs here before any review. On the self-hosted runner that would mean
# arbitrary code executing on a machine inside the home network. Branch
# protection does not prevent this -- fork PRs never touch main.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - name: Install
        working-directory: apps/site
        run: npm ci

      # tsc needs .astro/types.d.ts to resolve the `astro:content` import in
      # src/content.config.ts. That directory is gitignored and generated, so
      # on a clean checkout typecheck fails with TS2307 unless we sync first.
      - name: Generate content types
        working-directory: apps/site
        run: npx astro sync

      - name: Typecheck
        working-directory: apps/site
        run: npm run typecheck

      - name: Build
        working-directory: apps/site
        run: npm run build

      # The only place these are checked now that Cloudflare owns deploys.
      #
      # _redirects and _headers matter most: Pages fails them SILENTLY. If they
      # do not reach dist, every legacy Squarespace URL 404s and no cache header
      # is set, behind a deploy that reports success. They live in public/ and
      # are copied by the build, so a change there can drop them without
      # touching anything that looks related.
      - name: Verify build output
        working-directory: apps/site
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/_redirects
          test -s dist/_headers
          pages=$(find dist -name '*.html' | wc -l)
          echo "built $pages html pages"
          test "$pages" -ge 10

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
